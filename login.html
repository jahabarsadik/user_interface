<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In</title>

  <!-- Bootstrap 5 + Bootstrap Icons (local) -->
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/bootstrap-icons.min.css">
  <!-- Page styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

  <main class="login-wrap">
    <div class="card login-card shadow-sm">
      <div class="card-body p-4 p-sm-5">
        <div class="text-center mb-4">
          <img src="images/dbs-logo.jpg" alt="DBS" class="login-logo mb-3">
          <h1 class="h4 mb-1">Sign in</h1>
          <p class="text-body-secondary small mb-0">Enter your user name and password to continue</p>
        </div>

        <div class="alert alert-danger d-none small py-2" id="loginError" role="alert"></div>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="username" class="form-label">User name</label>
            <div class="input-group has-validation">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control" id="username" name="username"
                     autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
              <div class="invalid-feedback">Please enter your user name.</div>
            </div>
          </div>

          <div class="mb-2">
            <label for="password" class="form-label">Password</label>
            <div class="input-group has-validation">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="password" name="password"
                     autocomplete="current-password" required aria-describedby="capsWarning">
              <button class="btn btn-outline-secondary" type="button" id="togglePassword"
                      aria-label="Show password" aria-pressed="false">
                <i class="bi bi-eye"></i>
              </button>
              <div class="invalid-feedback">Please enter your password.</div>
            </div>
            <div class="form-text text-warning-emphasis d-none" id="capsWarning">
              <i class="bi bi-exclamation-triangle"></i> Caps Lock is on
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="remember" name="remember">
              <label class="form-check-label small" for="remember">Remember my user name</label>
            </div>
            <a href="#" class="small" id="forgotLink">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-primary w-100" id="loginButton">
            <span class="spinner-border spinner-border-sm me-1 d-none" aria-hidden="true"></span>
            <i class="bi bi-box-arrow-in-right"></i> <span class="btn-text">Sign in</span>
          </button>
        </form>
      </div>
    </div>
    <p class="text-center text-body-secondary small mt-3">&copy; 2026 AdminPanel</p>
  </main>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
